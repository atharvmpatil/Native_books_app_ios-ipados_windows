name: BooksApp
options:
  bundleIdPrefix: com.localbooks
  deploymentTarget:
    iOS: "16.0"
targets:
  BooksApp:
    type: application
    platform: iOS
    sources:
      - path: BooksApp
        excludes:
          - Info.plist
    info:
      path: BooksApp/Info.plist
      properties:
        CFBundleDisplayName: Books
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Used to sync your books, reading position, highlights, and bookmarks with your Windows PC on the same Wi-Fi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbooks.reader
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
