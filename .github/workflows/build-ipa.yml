name: Build Native iPhone & iPad IPA (No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
  run:
    working-directory: ios-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS/iPadOS App
        run: |
          xcodebuild \
            -project BooksApp.xcodeproj \
            -scheme BooksApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BooksApp.app Payload/
          zip -r BooksApp-iPhone-iPad.ipa Payload

      - name: Upload Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: BooksApp-iPhone-iPad-IPA
          path: BooksApp-iPhone-iPad.ipa
