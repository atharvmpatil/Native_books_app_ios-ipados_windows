name: Build Native iPhone & iPad IPA (No Mac Needed)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ios-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild \
            -project BooksApp.xcodeproj \
            -scheme BooksApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/BooksApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/BooksApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r BooksApp-iPhone-iPad.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooksApp-iPhone-iPad
          path: ios-app/build/BooksApp-iPhone-iPad.ipa
